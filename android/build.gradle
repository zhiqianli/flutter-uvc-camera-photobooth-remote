group 'com.chenyeju295.flutter_uvc_camera'
version '1.0-SNAPSHOT'

// 把 jitpack 注入到根工程，确保无论谁引用我都能解析  解决Flutterflow不能修改顶层build.gradle的问题
def injectRepo() {
    def rootRepo = rootProject.buildscript.repositories
    if (!rootRepo.find { it.url?.toString()?.contains('jitpack.io') }) {
        rootRepo.maven { url 'https://jitpack.io' }
    }
    def allRepo = rootProject.allprojects.collectMany { it.repositories }
    if (!allRepo.find { it.url?.toString()?.contains('jitpack.io') }) {
        rootProject.allprojects {
            repositories {
                maven { url 'https://jitpack.io' }
            }
        }
    }
}
injectRepo()


buildscript {
    ext.kotlin_version = '1.9.24'

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.chenyeju'
    }
    viewBinding {
        enabled = true
    }
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.android.support.constraint:constraint-layout: 5.0.0'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // 使用 JitPack 远程依赖
    implementation 'com.github.yuuk:AndroidUSBCamera:3.4.6'
}
